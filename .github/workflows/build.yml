name: Build

# Builds the module and runs the tests on every push to main, every pull request, and by hand
# (Actions > Build > Run workflow). The unsigned module is kept as the run's artifact.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: ./gradlew build
      - name: Keep the unsigned module
        uses: actions/upload-artifact@v4
        with:
          name: Tag-Hover-Tooltip-unsigned
          path: build/Tag-Hover-Tooltip.unsigned.modl
