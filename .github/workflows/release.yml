name: Release

# Pushing a tag like v1.0.0 builds the module and publishes it as a GitHub release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build and test
        run: ./gradlew build -Pversion="${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          build/Tag-Hover-Tooltip.unsigned.modl
          --title "$GITHUB_REF_NAME"
          --generate-notes
